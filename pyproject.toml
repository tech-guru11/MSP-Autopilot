[tool.ruff]
line-length = 79
target-version = "py313"
exclude = ["**/migrations/*", "**/__pycache__/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend"]
testpaths = ["backend"]
python_files = ["test_*.py", "tests*.py"]
